<footer class="site-footer">
  <div class="container site-footer__inner">
    <p class="site-footer__note">{{ site.Title }}</p>
    <nav class="site-footer__links" aria-label="联系方式">
      <a href="{{ site.Params.contact.github }}" rel="noreferrer" target="_blank">GitHub</a>
      {{ with site.Params.contact.email }}
        <a href="mailto:{{ . }}">邮箱</a>
      {{ end }}
      {{ with site.Params.contact.resume }}
        <a href="{{ . }}">简历</a>
      {{ end }}
    </nav>
  </div>
</footer>

<!doctype html>
<html lang="{{ site.Language.Lang | default "zh-CN" }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ block "title" . }}{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}{{ end }}</title>
    {{ $description := (.Description | default site.Params.description) | plainify | htmlUnescape }}
    <meta name="description" content="{{ $description }}">
    <link rel="canonical" href="{{ .Permalink }}">
    <meta property="og:site_name" content="{{ site.Title }}">
    <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
    <meta property="og:title" content="{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}">
    <meta property="og:description" content="{{ $description }}">
    <meta property="og:url" content="{{ .Permalink }}">
    <link rel="icon" href="{{ "favicon.svg" | relURL }}" type="image/svg+xml">
    {{ $style := resources.Get "css/portfolio.css" | minify | fingerprint }}
    <link rel="stylesheet" href="{{ $style.RelPermalink }}" integrity="{{ $style.Data.Integrity }}">
  </head>
  <body>
    <div class="site-shell">
      {{ partial "site-header.html" . }}
      <main id="main" class="site-main">
        {{ block "main" . }}{{ end }}
      </main>
      {{ partial "site-footer.html" . }}
    </div>
  </body>
</html>
